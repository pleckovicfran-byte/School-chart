<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fran School Life Chart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #18233d 0%, #090d18 45%, #05070d 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* BACK BUTTON */

    .back-button {
      position: fixed;
      top: 18px;
      left: 18px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(20,27,43,0.85);
      color: white;
      font-size: 25px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1000;
      backdrop-filter: blur(12px);
      transition: 0.2s;
    }

    .back-button:hover {
      background: #26334f;
      transform: translateX(-2px);
    }

    .back-button:active {
      transform: scale(0.92);
    }

    .app {
      width: 100%;
      max-width: 1050px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 15px;
    }

    .title {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #8f9bb3;
      font-size: 13px;
      margin-top: 4px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 12px;
      color: #aeb8ca;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #39e58c;
      border-radius: 50%;
      box-shadow: 0 0 12px #39e58c;
    }

    .card {
      background: rgba(13, 18, 31, 0.88);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.35);
      backdrop-filter: blur(20px);
    }

    .price-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 22px;
    }

    .label {
      color: #8995aa;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .price {
      font-size: clamp(40px, 7vw, 68px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
    }

    .change {
      margin-top: 9px;
      font-size: 15px;
      font-weight: 700;
    }

    .up {
      color: #35e58a;
    }

    .down {
      color: #ff5e72;
    }

    .neutral {
      color: #9aa6ba;
    }

    .chart-box {
      position: relative;
      height: 430px;
      background: rgba(5, 9, 17, 0.7);
      border-radius: 17px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    button:not(.back-button) {
      border: 1px solid rgba(255,255,255,0.09);
      background: #151c2d;
      color: #b9c3d5;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.18s;
    }

    button:not(.back-button):hover {
      background: #202a40;
      color: white;
      transform: translateY(-1px);
    }

    button.active {
      background: #2c5cff;
      color: white;
      border-color: #4670ff;
      box-shadow: 0 5px 18px rgba(44,92,255,0.25);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .info {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 14px;
      border-radius: 13px;
    }

    .info span {
      display: block;
      color: #7f8aa0;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .info strong {
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }

    .footer {
      text-align: center;
      color: #606b7f;
      font-size: 11px;
      margin-top: 15px;
    }

    @media (max-width: 700px) {

      .header {
        align-items: flex-start;
        padding-top: 15px;
      }

      .status {
        display: none;
      }

      .card {
        padding: 16px;
        border-radius: 18px;
      }

      .chart-box {
        height: 350px;
      }

      .info-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .price-section {
        align-items: flex-start;
      }

      .title {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <!-- BACK BUTTON -->

  <button
    class="back-button"
    onclick="goBack()"
    aria-label="Natrag"
  >
    ←
  </button>


  <div class="app">

    <div class="header">

      <div>
        <div class="title">
          📈 Fran School Life Chart
        </div>

        <div class="subtitle">
          Live school-life price tracker
        </div>
      </div>

      <div class="status">
        <div class="dot"></div>
        Market Open
      </div>

    </div>


    <div class="card">

      <div class="price-section">

        <div>

          <div class="label">
            FRAN SCHOOL LIFE
          </div>

          <div id="price" class="price neutral">
            1.00000
          </div>

          <div id="change" class="change neutral">
            0.00000 (0.00%)
          </div>

        </div>

      </div>


      <div class="chart-box">
        <canvas id="chart"></canvas>
      </div>


      <div class="controls">

        <button
          class="active"
          data-speed="2000"
        >
          Live
        </button>

        <button data-speed="5000">
          Slow
        </button>

        <button data-speed="1000">
          Fast
        </button>

        <button id="reset">
          Reset
        </button>

      </div>


      <div class="info-grid">

        <div class="info">
          <span>OPEN</span>
          <strong id="open">
            1.00000
          </strong>
        </div>

        <div class="info">
          <span>HIGH</span>
          <strong id="high">
            1.00000
          </strong>
        </div>

        <div class="info">
          <span>LOW</span>
          <strong id="low">
            1.00000
          </strong>
        </div>

        <div class="info">
          <span>LAST</span>
          <strong id="last">
            1.00000
          </strong>
        </div>

      </div>

    </div>


    <div class="footer">
      Fran School Life Chart • Simulated market data
    </div>

  </div>


  <script>

    /* =========================
       VARIABLES
    ========================= */

    const canvas =
      document.getElementById("chart");

    const ctx =
      canvas.getContext("2d");

    const priceElement =
      document.getElementById("price");

    const changeElement =
      document.getElementById("change");

    const openElement =
      document.getElementById("open");

    const highElement =
      document.getElementById("high");

    const lowElement =
      document.getElementById("low");

    const lastElement =
      document.getElementById("last");


    const START_PRICE = 1.00000;

    let price = START_PRICE;

    let open = START_PRICE;

    let high = START_PRICE;

    let low = START_PRICE;

    let history = [];

    let updateSpeed = 2000;

    let timer;


    const MAX_POINTS = 100;


    /* =========================
       BACK BUTTON
    ========================= */

    function goBack() {

      if (window.history.length > 1) {

        window.history.back();

      } else {

        /*
          Ako nema prethodne stranice,
          pokušaj otići na početnu stranicu.
        */

        window.location.href = "/";

      }

    }


    /* =========================
       CANVAS RESIZE
    ========================= */

    function resizeCanvas() {

      const rect =
        canvas.getBoundingClientRect();

      const dpr =
        window.devicePixelRatio || 1;

      canvas.width =
        rect.width * dpr;

      canvas.height =
        rect.height * dpr;

      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

      drawChart();

    }


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    /* =========================
       INITIAL CHART
    ========================= */

    for (
      let i = 0;
      i < 45;
      i++
    ) {

      history.push(START_PRICE);

    }


    /* =========================
       UPDATE PRICE
    ========================= */

    function updatePrice() {

      /*
        Random movement.

        Cijena se uvijek zaokružuje
        na točno 5 decimala.
      */

      const movement =
        (Math.random() - 0.5) * 0.015;

      price += movement;


      /*
        Minimalna cijena
      */

      if (price < 0.10000) {

        price = 0.10000;

      }


      /*
        5 DECIMALA
      */

      price =
        Number(price.toFixed(5));


      /*
        HIGH / LOW
      */

      high =
        Math.max(high, price);

      low =
        Math.min(low, price);


      /*
        HISTORY
      */

      history.push(price);


      if (
        history.length > MAX_POINTS
      ) {

        history.shift();

      }


      updateUI();

      drawChart();

    }


    /* =========================
       UPDATE UI
    ========================= */

    function updateUI() {

      const difference =
        price - START_PRICE;

      const percentage =
        difference / START_PRICE * 100;


      priceElement.textContent =
        price.toFixed(5);


      changeElement.textContent =
        `${difference >= 0 ? "+" : ""}${difference.toFixed(5)}
        (${percentage >= 0 ? "+" : ""}${percentage.toFixed(2)}%)`;


      /*
        PRICE COLOR
      */

      priceElement.classList.remove(
        "up",
        "down",
        "neutral"
      );

      changeElement.classList.remove(
        "up",
        "down",
        "neutral"
      );


      if (difference > 0) {

        priceElement.classList.add("up");

        changeElement.classList.add("up");

      }

      else if (difference < 0) {

        priceElement.classList.add("down");

        changeElement.classList.add("down");

      }

      else {

        priceElement.classList.add("neutral");

        changeElement.classList.add("neutral");

      }


      /*
        INFO
      */

      openElement.textContent =
        open.toFixed(5);

      highElement.textContent =
        high.toFixed(5);

      lowElement.textContent =
        low.toFixed(5);

      lastElement.textContent =
        price.toFixed(5);

    }


    /* =========================
       DRAW CHART
    ========================= */

    function drawChart() {

      const width =
        canvas.clientWidth;

      const height =
        canvas.clientHeight;


      if (
        !width ||
        !height
      ) {

        return;

      }


      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      /* GRID */

      ctx.lineWidth = 1;

      ctx.strokeStyle =
        "rgba(255,255,255,0.055)";


      for (
        let i = 1;
        i < 6;
        i++
      ) {

        const y =
          height / 6 * i;

        ctx.beginPath();

        ctx.moveTo(
          0,
          y
        );

        ctx.lineTo(
          width,
          y
        );

        ctx.stroke();

      }


      for (
        let i = 1;
        i < 10;
        i++
      ) {

        const x =
          width / 10 * i;

        ctx.beginPath();

        ctx.moveTo(
          x,
          0
        );

        ctx.lineTo(
          x,
          height
        );

        ctx.stroke();

      }


      /* RANGE */

      const min =
        Math.min(...history);

      const max =
        Math.max(...history);

      let range =
        max - min;


      if (range < 0.005) {

        range = 0.005;

      }


      const padding =
        range * 0.25;


      const chartMin =
        min - padding;

      const chartMax =
        max + padding;


      /* GRADIENT */

      const gradient =
        ctx.createLinearGradient(
          0,
          0,
          0,
          height
        );


      gradient.addColorStop(
        0,
        "rgba(53,229,138,0.25)"
      );

      gradient.addColorStop(
        1,
        "rgba(53,229,138,0)"
      );


      /* FILL */

      ctx.beginPath();


      history.forEach(
        (value, index) => {

          const x =
            index /
            (history.length - 1) *
            width;

          const y =
            height -
            (
              (value - chartMin) /
              (chartMax - chartMin)
            ) *
            height;


          if (index === 0) {

            ctx.moveTo(
              x,
              y
            );

          } else {

            ctx.lineTo(
              x,
              y
            );

          }

        }
      );


      ctx.lineTo(
        width,
        height
      );

      ctx.lineTo(
        0,
        height
      );

      ctx.closePath();

      ctx.fillStyle =
        gradient;

      ctx.fill();


      /* LINE */

      ctx.beginPath();


      history.forEach(
        (value, index) => {

          const x =
            index /
            (history.length - 1) *
            width;

          const y =
            height -
            (
              (value - chartMin) /
              (chartMax - chartMin)
            ) *
            height;


          if (index === 0) {

            ctx.moveTo(
              x,
              y
            );

          } else {

            ctx.lineTo(
              x,
              y
            );

          }

        }
      );


      ctx.lineWidth = 3;

      ctx.strokeStyle =
        price >= START_PRICE
          ? "#35e58a"
          : "#ff5e72";

      ctx.stroke();


      /* CURRENT PRICE DOT */

      const lastIndex =
        history.length - 1;

      const lastX =
        width;

      const lastY =
        height -
        (
          (history[lastIndex] - chartMin) /
          (chartMax - chartMin)
        ) *
        height;


      ctx.beginPath();

      ctx.arc(
        lastX,
        lastY,
        5,
        0,
        Math.PI * 2
      );


      ctx.fillStyle =
        price >= START_PRICE
          ? "#35e58a"
          : "#ff5e72";

      ctx.fill();

    }


    /* =========================
       SPEED BUTTONS
    ========================= */

    document
      .querySelectorAll(
        "button[data-speed]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                "button[data-speed]"
              )
              .forEach(b =>
                b.classList.remove(
                  "active"
                )
              );


            button.classList.add(
              "active"
            );


            updateSpeed =
              Number(
                button.dataset.speed
              );


            startTimer();

          }
        );

      });


    /* =========================
       RESET
    ========================= */

    document
      .getElementById("reset")
      .addEventListener(
        "click",
        () => {

          price =
            START_PRICE;

          open =
            START_PRICE;

          high =
            START_PRICE;

          low =
            START_PRICE;


          history =
            Array(
              45
            ).fill(
              START_PRICE
            );


          updateUI();

          drawChart();

        }
      );


    /* =========================
       TIMER
    ========================= */

    function startTimer() {

      clearInterval(timer);

      timer =
        setInterval(
          updatePrice,
          updateSpeed
        );

    }


    /* =========================
       START
    ========================= */

    resizeCanvas();

    updateUI();

    startTimer();

  </script>

</body>
</html>
